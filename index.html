<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Powerstar Supermarkets | Shop Groceries Online</title>

  <link rel="shortcut icon" href="./assets/favicon.ico" type="image/x-icon">

  <link rel="stylesheet" href="./css/style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

  <div class="overlay" data-overlay></div>

  <header style="background: var(--white); box-shadow: 0 4px 15px rgba(0,0,0,0.05); position: sticky; top: 0; z-index: 1000;">
    <div class="header-main" style="padding: 15px 0;">
      <div class="container" style="display: flex; align-items: center; justify-content: space-between; gap: 20px;">

        <a href="index.html" class="header-logo" style="flex-shrink: 0; width: 140px;">
          <img src="./assets/logo.png" alt="Powerstar Logo" style="width: 100%; height: 60px; object-fit: contain;">
        </a>

        <div class="header-search-container" style="flex-grow: 1; max-width: 600px; position: relative;">
          <input type="search" id="main-search" class="search-field" placeholder="Search for groceries, electronics..." style="width: 100%; padding: 12px 20px; border: 1px solid var(--cultured); border-radius: 30px; font-size: 0.9rem; background: var(--cultured); outline: none;">
          <button class="search-btn" style="position: absolute; right: 5px; top: 50%; transform: translateY(-50%); background: var(--ps-red); color: var(--white); width: 35px; height: 35px; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
            <ion-icon name="search-outline"></ion-icon>
          </button>
        </div>

        <div class="header-user-actions" style="display: flex; align-items: center; gap: 20px;">
          
          <button class="action-btn" style="display: flex; align-items: center; gap: 5px; color: var(--ps-green); font-weight: 600;">
            <ion-icon name="location-outline" style="font-size: 1.5rem;"></ion-icon>
            <span id="current-branch-display" style="font-size: 0.85rem;">Select Branch</span>
          </button>

          <button class="action-btn" style="color: var(--eerie-black); font-size: 1.5rem;" title="SmartClub Loyalty">
            <ion-icon name="person-circle-outline"></ion-icon>
          </button>

          <button class="action-btn" style="position: relative; color: var(--eerie-black); font-size: 1.5rem;">
            <ion-icon name="bag-handle-outline"></ion-icon>
            <span class="count" id="header-cart-badge" style="position: absolute; top: -5px; right: -8px; background: var(--ps-red); color: var(--white); font-size: 0.7rem; font-weight: 700; padding: 2px 6px; border-radius: 50px;">0</span>
          </button>

        </div>

      </div>
    </div>
  </header>

  <main>
    <div class="container" style="padding-top: 30px; text-align: center;">
      <h2 style="color: var(--ps-green); font-family: 'Poppins';">Welcome to the Staging Environment</h2>
      <p style="color: var(--sonic-silver);">Header and Brand CSS loaded successfully.</p>
    </div>
  </main>

  <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
</body>
</html>
